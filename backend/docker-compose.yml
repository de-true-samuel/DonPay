# Local Postgres for development and integration tests. Port 54329 avoids clashing with other local databases.
name: kobo-exact
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kobo
      POSTGRES_PASSWORD: kobo
      POSTGRES_DB: kobo_exact
    ports:
      - "54329:5432"
    volumes:
      - kobo_exact_pg:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kobo -d kobo_exact"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  kobo_exact_pg:
